name: Python validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Tests including production without raw data
        run: python -m pytest -q
      - name: Ensure protected files are not tracked
        run: |
          python - <<'PY'
          import subprocess
          files = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          forbidden = [f for f in files if f.startswith(('data/raw/', 'referencias/', '.local/')) or f == '.env' or (f.startswith('.env.') and f != '.env.example')]
          assert not forbidden, forbidden
          PY
